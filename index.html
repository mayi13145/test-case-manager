<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テストケース管理ツール</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>テストケース管理ツール</h1>
  </header>

  <main>
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">テスト結果</h2>
      <dl>
        <div>
          <dt>テストケース総数</dt>
          <dd id="total-count">0</dd>
        </div>
        <div>
          <dt>合格</dt>
          <dd id="passed-count">0</dd>
        </div>
        <div>
          <dt>不合格</dt>
          <dd id="failed-count">0</dd>
        </div>
      </dl>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">テストケース一覧</h2>
      <div>
        <label for="status-filter">テスト状態で絞り込む</label>
        <select id="status-filter" name="status-filter">
          <option value="all">すべて</option>
          <option value="not-run">未実施</option>
          <option value="passed">合格</option>
          <option value="failed">不合格</option>
        </select>
        <button id="add-test-case-button" type="button">テストケースを追加</button>
      </div>

      <table>
        <thead>
          <tr>
            <th scope="col">用例番号</th>
            <th scope="col">タイトル</th>
            <th scope="col">テストモジュール</th>
            <th scope="col">テスト手順</th>
            <th scope="col">期待結果</th>
            <th scope="col">実際の結果</th>
            <th scope="col">テスト状態</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody id="test-case-list">
        </tbody>
      </table>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">テストケースを追加</h2>
      <form id="test-case-form">
        <div>
          <label for="case-id">用例番号</label>
          <input id="case-id" name="case-id" type="text" required>
        </div>
        <div>
          <label for="title">タイトル</label>
          <input id="title" name="title" type="text" required>
        </div>
        <div>
          <label for="module">テストモジュール</label>
          <input id="module" name="module" type="text" required>
        </div>
        <div>
          <label for="steps">テスト手順</label>
          <textarea id="steps" name="steps" rows="4" required></textarea>
        </div>
        <div>
          <label for="expected-result">期待結果</label>
          <textarea id="expected-result" name="expected-result" rows="3" required></textarea>
        </div>
        <div>
          <label for="actual-result">実際の結果</label>
          <textarea id="actual-result" name="actual-result" rows="3"></textarea>
        </div>
        <div>
          <label for="test-status">テスト状態</label>
          <select id="test-status" name="test-status">
            <option value="not-run">未実施</option>
            <option value="passed">合格</option>
            <option value="failed">不合格</option>
          </select>
        </div>
        <button type="submit">保存</button>
        <button id="cancel-edit-button" type="button">キャンセル</button>
      </form>
    </section>
  </main>
</body>
</html>
